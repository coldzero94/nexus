name: kotlin

on:
  pull_request:
    paths:
      - "kotlin/**"
      - ".github/workflows/kotlin-ci.yml"
  push:
    branches: [main]
    paths:
      - "kotlin/**"
      - ".github/workflows/kotlin-ci.yml"

permissions:
  contents: write

defaults:
  run:
    working-directory: kotlin

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 업로드 키 Secret 유무 (#230) — step-level env는 같은 step의 if에서 평가되지 않아 job 레벨로 둔다
      HAS_UPLOAD_KEY: ${{ secrets.NEXUS_UPLOAD_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      # 포맷·정적분석·Android Lint (#242) — Lint는 매니페스트 권한·backup_rules 오설정·HC 회귀를
      # 잡는 무료 게이트. error 0건 상태라 baseline 없이 abortOnError로 새 error를 즉시 차단한다.
      - name: Quality gates (format + static analysis + lint)
        run: ./gradlew spotlessCheck detekt :app:lintDebug
      # core: JVM 테스트(케이스 테이블) + iOS klib 컴파일(commonMain 오염 차단, 리눅스에서 가능)
      - name: Build and test
        run: >
          ./gradlew :core:jvmTest :app:testDebugUnitTest :core:compileKotlinIosArm64
          :app:assembleDebug :app:assembleRelease
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-report
          path: kotlin/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-debug-apk
          path: kotlin/app/build/outputs/apk/debug/app-debug.apk
      # ── 릴리스 서명 (#230) ──
      # 업로드 키스토어를 base64 Secret에서 복원. Secret 미설정(#11 대기)이면 이 스텝을 건너뛰고
      # Gradle이 debug 키로 폴백한다 — 빌드는 계속되지만 인플레이스 업데이트·Play 업로드는 불가.
      - name: Restore upload keystore
        id: keystore
        if: github.event_name == 'push' && env.HAS_UPLOAD_KEY == 'true'
        env:
          NEXUS_UPLOAD_KEYSTORE: ${{ secrets.NEXUS_UPLOAD_KEYSTORE }}
        run: |
          echo "$NEXUS_UPLOAD_KEYSTORE" | base64 -d > upload.jks
          test -s upload.jks
          echo "signed=true" >> "$GITHUB_OUTPUT"
      # versionCode는 항상 run_number — Play 내부 트랙이 동일 versionCode 재업로드를 거부한다
      - name: Build release APK
        if: github.event_name == 'push'
        env:
          STORE_PASSWORD: ${{ secrets.NEXUS_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXUS_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXUS_UPLOAD_KEY_PASSWORD }}
        run: |
          # 서명 property는 4종을 모두 주거나 하나도 주지 않는다 — 일부만 주면 빌드가 실패한다(의도된 가드).
          # Secret 미설정(#11 대기) 시엔 아무것도 넘기지 않아 debug 폴백으로 빌드된다.
          # lintVitalRelease = Play가 실제로 돌리는 검사 — 업로드 전에 여기서 걸러낸다 (#242)
          ARGS=(":app:lintVitalRelease" ":app:assembleRelease" "-Pnexus.versionCode=${{ github.run_number }}")
          if [ "$HAS_UPLOAD_KEY" = "true" ]; then
            ARGS+=(
              "-Pnexus.upload.storeFile=upload.jks"
              "-Pnexus.upload.storePassword=$STORE_PASSWORD"
              "-Pnexus.upload.keyAlias=$KEY_ALIAS"
              "-Pnexus.upload.keyPassword=$KEY_PASSWORD"
            )
          fi
          ./gradlew "${ARGS[@]}"
      # 서명 주체를 APK에서 직접 확인 (#230 리뷰) — "무엇을 넣었나"가 아니라 "무엇으로 서명됐나"로
      # 릴리스 노트를 정한다. 안드로이드 디버그 인증서면 인플레이스 업데이트가 불가하므로 그렇게 알린다.
      - name: Verify release signer
        id: signer
        if: github.event_name == 'push'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          echo "$CERTS" | grep -E "certificate DN:"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      # main 머지 시: GitHub Release로 APK 배포 (설치 링크 = 릴리즈 페이지)
      - name: Release APK
        if: github.event_name == 'push'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signer.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            NOTE="main 자동 빌드 — 커밋 ${{ github.sha }} · 업로드 키 서명(인플레이스 업데이트 가능)"
          else
            NOTE="main 자동 빌드 — 커밋 ${{ github.sha }} · ⚠ 업로드 키 미설정(#11)이라 debug 키 서명 — 이전 빌드 위에 덮어 설치되지 않을 수 있어요"
          fi
          gh release create "build-${{ github.run_number }}" \
            kotlin/app/build/outputs/apk/release/app-release.apk \
            --title "NEXUS dev build ${{ github.run_number }}" \
            --notes "$NOTE"
