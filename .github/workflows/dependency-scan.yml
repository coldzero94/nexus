name: dependency-scan

# 의존성 취약점 스캔 (#244, E15-16)
#
# 건강 데이터를 다루고 네트워크 egress(Sentry·TelemetryDeck)가 있어, 트랜지티브 CVE가 무감시로
# 남으면 원값 유출·MITM의 실질 경로가 된다.
#
# **advisory-only로 시작한다**(continue-on-error): 도입 시점에 이미 알려진 2건(guava, Health
# Connect SDK의 트랜지티브)이 있어 바로 차단하면 CI가 상시 빨간불이 된다. 트리아지 절차가
# 자리잡은 뒤 차단으로 승격한다 — 판단 기준은 docs/OPS.md §5.
on:
  schedule:
    # 매주 월요일 09:00 KST (UTC 00:00) — Dependabot PR과 같은 날에 모아 본다
    - cron: "0 0 * * 1"
  pull_request:
    paths:
      - "kotlin/**/gradle.lockfile"
      - "kotlin/gradle/libs.versions.toml"
      - ".github/workflows/dependency-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 락파일은 런타임 클래스패스만 담는다(빌드 도구 CVE 노이즈 배제, kotlin/build.gradle.kts 참고)
      - name: OSV scan (advisory-only)
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=kotlin/app/gradle.lockfile
            --format=table
      - name: Report result
        if: always()
        run: |
          if [ "${{ steps.osv.outcome }}" = "failure" ]; then
            echo "::warning::알려진 취약점이 있습니다 — 위 로그를 보고 docs/OPS.md §5 절차로 트리아지하세요(현재 advisory-only라 빌드는 통과)."
          else
            echo "취약점 없음."
          fi
