name: web

on:
  pull_request:
    paths:
      - "web/**"
      # 정책 페이지가 매니페스트 권한을 다 설명하는지 검사하므로 앱 권한 변경도 트리거한다 (#52)
      - "kotlin/app/src/main/AndroidManifest.xml"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "kotlin/app/src/main/AndroidManifest.xml"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

# 연달아 push하면 앞선 실행은 의미가 없다 — 큐만 쌓인다
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # 버전은 web/package.json의 packageManager가 단일 출처 — version:을 함께 주면
      # 루트 package.json이 생기는 순간 'Multiple versions of pnpm specified'로 죽는다
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 빌드 → 타입 검사 → 정책 정합(권한 누락·과다 고지·OG 누락)
      - run: pnpm verify
