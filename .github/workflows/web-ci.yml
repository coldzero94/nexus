name: web

on:
  pull_request:
    paths:
      - "web/**"
      # 정책 페이지가 매니페스트 권한을 다 설명하는지 검사하므로 앱 권한 변경도 트리거한다 (#52)
      - "kotlin/app/src/main/AndroidManifest.xml"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "kotlin/app/src/main/AndroidManifest.xml"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

# 연달아 push하면 앞선 실행은 의미가 없다 — 큐만 쌓인다
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 버전은 web/package.json의 packageManager가 단일 출처 — version:을 함께 주면
      # 루트 package.json이 생기는 순간 'Multiple versions of pnpm specified'로 죽는다
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 빌드 → 타입 검사 → 정책 정합(권한 누락·과다 고지·OG 누락)
      - run: pnpm verify
